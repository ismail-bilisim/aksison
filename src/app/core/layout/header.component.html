<!-- Header Navigation -->
<nav class="header-navbar">
  <div class="header-left">
    <!-- Hamburger Menu Button (Mobile) -->
    <button class="sidebar-toggle d-lg-none" 
            type="button" 
            (click)="toggleSidebar()">
      <i class="bi bi-list"></i>
    </button>

    <!-- Brand -->
    <a class="header-brand" routerLink="/">
      <i class="bi bi-mortarboard-fill brand-icon"></i>
      <span class="brand-text">Aksis</span>
    </a>
  </div>

  <!-- Right side navigation -->
  <div class="header-right">
    <!-- Profile Dropdown -->
    <div class="dropdown" ngbDropdown>
      <button class="profile-toggle" 
              ngbDropdownToggle 
              type="button">
        <div class="profile-avatar">
          <i class="bi bi-person-fill"></i>
        </div>
        <span class="d-none d-sm-inline profile-name">Profil</span>
        <i class="bi bi-chevron-down profile-chevron d-none d-sm-inline"></i>
      </button>
      <ul class="dropdown-menu dropdown-menu-end shadow-lg" ngbDropdownMenu>
        <li>
          <div class="dropdown-header-info">
            <div class="dropdown-avatar"><i class="bi bi-person-fill"></i></div>
            <span class="fw-semibold">Kullanıcı</span>
          </div>
        </li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item" ngbDropdownItem href="#"><i class="bi bi-person me-2"></i>Profil Bilgileri</a></li>
        <li><a class="dropdown-item" ngbDropdownItem href="#"><i class="bi bi-gear me-2"></i>Ayarlar</a></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item text-danger" ngbDropdownItem (click)="logout()"><i class="bi bi-box-arrow-right me-2"></i>Çıkış Yap</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Spacer for fixed header -->
<div class="header-spacer"></div>
