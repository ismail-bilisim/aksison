<div class="list-container">
  @if (projeler && projeler.length > 0) {
    <div class="list-header">
      <span class="list-count">
        <i class="bi bi-folder me-1"></i>
        {{ projeler.length }} proje
      </span>
    </div>
    <div class="list-items">
      @for (proje of projeler; track proje.id) {
        <div class="list-item" 
             role="button"
             tabindex="0"
             (click)="onProjeClick(proje.id)"
             (keydown.enter)="onProjeClick(proje.id)">
          <div class="item-icon">
            <i class="bi bi-folder"></i>
          </div>
          <div class="item-content">
            <div class="item-title">{{ proje.projeAdi }}</div>
            @if (proje.baslangicTarihi) {
              <div class="item-subtitle">
                <i class="bi bi-calendar-event me-1"></i>{{ proje.baslangicTarihi | date:'dd.MM.yyyy' }}
              </div>
            }
          </div>
          <div class="item-action">
            <i class="bi bi-chevron-right"></i>
          </div>
        </div>
      }
    </div>
  } @else {
    <div class="empty-state">
      <i class="bi bi-folder"></i>
      <p>Proje bulunamadı.</p>
    </div>
  }
</div>
