@if (loading) {
  <div class="d-flex justify-content-center align-items-center" style="min-height: 300px;">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Yükleniyor...</span>
    </div>
  </div>
} @else if (canliders) {
  <div class="container-fluid py-4">

    <!-- Başlık -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h6>
        <i class="bi bi-pencil-square me-2"></i>Canlı Ders Başvurusu
      </h6>
    </div>

    <!-- Ders Bilgileri -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <app-canliders-basvuru [canliders]="canliders"></app-canliders-basvuru>
      </div>
    </div>

    <!-- Başvuru Formu -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h6 class="mb-3">
          <i class="bi bi-file-earmark-text me-2"></i>Başvuru Bilgileri
        </h6>

        <div class="mb-3">
          <label for="aciklama" class="form-label">Açıklama <span class="text-muted">(Opsiyonel)</span></label>
          <textarea
            id="aciklama"
            class="form-control"
            rows="2"
            maxlength="255"
            placeholder="Başvurunuzla ilgili eklemek istediğiniz açıklama..."
            [(ngModel)]="aciklama">
          </textarea>
          <div class="form-text">{{ aciklama.length }} / 255 karakter</div>
        </div>

        <div class="d-flex justify-content-end gap-1">
          <button
            class="btn btn-primary"
            (click)="basvuruYap()"
            [disabled]="submitting">
            @if (submitting) {
              <span class="spinner-border spinner-border-sm me-1" role="status"></span>
              Gönderiliyor...
            } @else {
              <i class="bi bi-send me-1"></i>Başvuru Yap
            }
          </button>
        </div>
      </div>
    </div>

  </div>
} @else {
  <div class="alert alert-warning m-2">
    <i class="bi bi-exclamation-triangle me-2"></i>Canlı ders bulunamadı.
  </div>
}
