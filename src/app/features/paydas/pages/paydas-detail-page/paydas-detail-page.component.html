<div class="container-fluid">
  <div class="row">
    <div class="col">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h5>Paydaş Detayı</h5>
        <div>
          <button class="btn btn-secondary" (click)="onBack()">
            <i class="bi bi-arrow-left me-1"></i>Geri
          </button>
        </div>
      </div>

      @if (loading) {
        <div class="text-center p-5">
          <div class="spinner-border" role="status">
            <span class="visually-hidden">Yükleniyor...</span>
          </div>
        </div>
      } @else if (paydas) {
        
        <!-- Paydaş Temel Bilgileri -->
        <app-paydas-temel 
          [paydas]="paydas" 
          [canEdit]="true"
          [canSubmitForApproval]="true"
          [canApprove]="true"
          (edit)="onEdit()"
          (submitForApproval)="icerikOnayinaSun()"
          (approve)="icerikOnayla()"
          (reject)="icerikReddet()">
        </app-paydas-temel>

        <!-- Tabs for additional info -->
        <div class="mt-4">
          <ul ngbNav #nav="ngbNav" [(activeId)]="activeTab" (activeIdChange)="onTabChange($event)" class="nav-tabs">
            <li [ngbNavItem]="'bilgiler'">
              <button ngbNavLink>Bilgiler</button>
              <ng-template ngbNavContent>
                <div class="p-3 text-muted">
                  Temel bilgiler yukarıda gösterilmektedir.
                </div>
              </ng-template>
            </li>
            <li [ngbNavItem]="'videodersler'">
              <button ngbNavLink>Video Dersler</button>
              <ng-template ngbNavContent>
                <app-videoders-list 
                  [videodersler]="videodersler()"
                  [isLoading]="videodersLoading()"
                  [errorMessage]="videodersError()"
                  (select)="onVideodersSelect($event)">
                </app-videoders-list>
              </ng-template>
            </li>
            <li [ngbNavItem]="'yuzyuzedersler'">
              <button ngbNavLink>Yüz Yüze Dersler</button>
              <ng-template ngbNavContent>
                <app-yuzyuzeders-list 
                  [yuzyuzedersler]="yuzyuzedersler()"
                  [isLoading]="yuzyuzedersLoading()"
                  [errorMessage]="yuzyuzedersError()"
                  (select)="onYuzyuzedersSelect($event)">
                </app-yuzyuzeders-list>
              </ng-template>
            </li>
          </ul>

          <div [ngbNavOutlet]="nav" class="mt-3"></div>
        </div>

      } @else {
        <div class="alert alert-warning mt-3">
          Paydaş bulunamadı.
        </div>
      }
    </div>
  </div>
</div>
