<div class="list-container">
  @if (paydaslar && paydaslar.length > 0) {
    <div class="list-header">
      <span class="list-count">
        <i class="bi bi-building me-1"></i>
        {{ paydaslar.length }} paydaş
      </span>
    </div>
    <div class="list-items">
      @for (paydas of paydaslar; track paydas.id) {
        <div class="list-item" 
             role="button"
             tabindex="0"
             (click)="onPaydasClick(paydas.id)"
             (keydown.enter)="onPaydasClick(paydas.id)">
          <div class="item-icon">
            <i class="bi bi-building"></i>
          </div>
          <div class="item-content">
            <div class="item-title">{{ paydas.adi }}</div>
            @if (paydas.temsilci) {
              <div class="item-subtitle">
                <i class="bi bi-person me-1"></i>{{ paydas.temsilci }}
              </div>
            }
          </div>
          <div class="item-action">
            <i class="bi bi-chevron-right"></i>
          </div>
        </div>
      }
    </div>
  } @else {
    <div class="empty-state">
      <i class="bi bi-building"></i>
      <p>Paydaş bulunamadı.</p>
    </div>
  }
</div>
