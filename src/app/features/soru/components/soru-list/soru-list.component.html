<div class="soru-list">
  @if (sorular.length === 0) {
    <div class="alert alert-info text-center">
      <i class="bi bi-info-circle fs-3 d-block mb-2"></i>
      <p class="mb-0">Henüz soru bulunmamaktadır.</p>
    </div>
  } @else {
    <div class="table-responsive">
      <table class="table table-hover">
        <thead class="table-light">
          <tr>
            <th style="width: 80px;">ID</th>
            <th style="width: 150px;">Soru Tipi</th>
            <th>Soru Metni</th>
            <th style="width: 200px;">İşlemler</th>
          </tr>
        </thead>
        <tbody>
          @for (soru of sorular; track soru.id) {
            <tr (click)="onRowClick(soru.id)" class="clickable-row" role="button">
              <td>{{ soru.id }}</td>
              <td>
                <span class="badge bg-info">{{ getSoruTipiLabel(soru.soruTipi.adi) }}</span>
              </td>
              <td>
                <div class="text-truncate" style="max-width: 400px;" [title]="soru.soruMetni">
                  {{ truncateText(soru.soruMetni, 100) }}
                </div>
              </td>
              <td>
                <div class="btn-group btn-group-sm" role="group">
                  <button class="btn btn-outline-primary" 
                          (click)="onEdit($event, soru.id)"
                          title="Düzenle">
                    <i class="bi bi-pencil"></i>
                  </button>
                  <button class="btn btn-outline-danger" 
                          (click)="onDelete($event, soru.id)"
                          title="Sil">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-3">
      <p class="text-muted mb-0">Toplam {{ sorular.length }} soru</p>
    </div>
  }
</div>
