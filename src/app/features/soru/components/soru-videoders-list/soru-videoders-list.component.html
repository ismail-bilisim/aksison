<div class="soru-videoders-list">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h6 class="mb-0">
      <i class="bi bi-camera-video me-2"></i>
      İlişkili Video Dersler
      <span class="badge bg-primary ms-2">{{ videodersList.length }}</span>
    </h6>
  </div>

  @if (loading) {
    <div class="text-center p-3">
      <div class="spinner-border spinner-border-sm" role="status">
        <span class="visually-hidden">Yükleniyor...</span>
      </div>
    </div>
  } @else if (videodersList.length === 0) {
    <div class="alert alert-info text-center">
      <i class="bi bi-info-circle fs-3 d-block mb-2"></i>
      <p class="mb-0">Bu soru henüz hiçbir video derste kullanılmamış.</p>
    </div>
  } @else {
    <div class="table-responsive">
      <table class="table table-hover">
        <thead class="table-light">
          <tr>
            <th>Ders Kodu</th>
            <th>Ders Adı</th>
            <th>İşlem</th>
          </tr>
        </thead>
        <tbody>
          @for (ders of videodersList; track ders.id) {
            <tr>
              <td>{{ ders.kodu }}</td>
              <td>{{ ders.adi }}</td>
              <td>
                <button class="btn btn-sm btn-outline-primary" 
                        (click)="navigateToVideoDers(ders.id)"
                        title="Ders detayını görüntüle">
                  <i class="bi bi-eye me-1"></i>
                  Görüntüle
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
