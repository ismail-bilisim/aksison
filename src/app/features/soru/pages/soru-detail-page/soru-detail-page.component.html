<div class="container-fluid">
  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div class="d-flex align-items-center gap-3">
      <button class="btn btn-outline-secondary" (click)="onBack()" title="Geri dön">
        <i class="bi bi-arrow-left"></i>
      </button>
      <h5 class="mb-0">
        <i class="bi bi-question-circle me-2"></i>
        Soru Detayı
        @if (soru) {
          <span class="text-muted">#{{ soru.id }}</span>
        }
      </h5>
    </div>
    <button class="btn btn-primary" (click)="onEdit()" *ngIf="soru">
      <i class="bi bi-pencil me-2"></i>Düzenle
    </button>
  </div>

  @if (loading) {
    <div class="text-center p-5">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Yükleniyor...</span>
      </div>
      <p class="mt-2">Soru detayları yükleniyor...</p>
    </div>
  } @else if (soru) {
    <!-- Temel Bilgiler Card -->
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-light">
        <h6 class="mb-0">
          <i class="bi bi-info-circle me-2"></i>Temel Bilgiler
        </h6>
      </div>
      <div class="card-body">
        <app-soru-temel [soru]="soru"></app-soru-temel>
      </div>
    </div>

    <!-- İlişkiler Tabs -->
    <div class="card shadow-sm">
      <div class="card-header bg-light">
        <h6 class="mb-0">
          <i class="bi bi-diagram-3 me-2"></i>İlişkili Varlıklar
        </h6>
      </div>
      <div class="card-body">
        <ul ngbNav #nav="ngbNav" [(activeId)]="activeTab" class="nav-tabs">
          <!-- Video Dersler Tab -->
          <li [ngbNavItem]="'videoders'">
            <button ngbNavLink>
              <i class="bi bi-camera-video me-1"></i>
              Video Dersler
            </button>
            <ng-template ngbNavContent>
              <app-soru-videoders-list [soruId]="soru.id"></app-soru-videoders-list>
            </ng-template>
          </li>

          <!-- Yüzyüze Dersler Tab -->
          <li [ngbNavItem]="'yuzyuzeders'">
            <button ngbNavLink>
              <i class="bi bi-people me-1"></i>
              Yüzyüze Dersler
            </button>
            <ng-template ngbNavContent>
              <app-soru-yuzyuzeders-list [soruId]="soru.id"></app-soru-yuzyuzeders-list>
            </ng-template>
          </li>

          <!-- Konular Tab -->
          <li [ngbNavItem]="'konular'">
            <button ngbNavLink>
              <i class="bi bi-book me-1"></i>
              Konular
            </button>
            <ng-template ngbNavContent>
              <app-soru-konu-list [soruId]="soru.id"></app-soru-konu-list>
            </ng-template>
          </li>
        </ul>

        <div [ngbNavOutlet]="nav" class="mt-3"></div>
      </div>
    </div>
  }
</div>
