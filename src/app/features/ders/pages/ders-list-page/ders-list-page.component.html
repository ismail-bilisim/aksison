<div class="container-fluid">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>{{ pageTitle }}</h2>
    <button class="btn btn-primary" (click)="onNewDers()">
      <i class="bi bi-plus-circle me-2"></i>Yeni Ders
    </button>
  </div>

  <app-ders-list 
    [dersler]="dersler"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)"
    (viewDetail)="onViewDetail($event)">
  </app-ders-list>
</div>
