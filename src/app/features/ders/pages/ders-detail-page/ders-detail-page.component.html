<div class="container-fluid">
  <div class="row">
    <div class="col">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5> </h5>
        <div>
          @if (ders && ders.onayDurumu !== OnayDurumu.ONAYLI) {
            <button class="btn btn-primary me-2" (click)="onEdit(ders.id!)">
              <i class="bi bi-pencil me-1"></i>
              Düzenle
            </button>
          }

          @if (ders && (ders.onayDurumu === OnayDurumu.TASLAK || ders.onayDurumu === OnayDurumu.RED) ) {
            <button class="btn btn-primary me-2" (click)="baslatmaOnayinaSun()" [disabled]="submitting">
              <i class="bi bi-send me-1"></i>
              Başlatma Onayına Sun
            </button>
          }

          @if (ders && ders.onayDurumu === OnayDurumu.ONAYA_SUNULDU) {
            <button class="btn btn-success me-2" (click)="baslatmaOnayla()" [disabled]="submitting">
              <i class="bi bi-check-circle me-1"></i>
              Başlatmayı Onayla
            </button>
            <button class="btn btn-danger me-2" (click)="baslatmaReddet()" [disabled]="submitting">
              <i class="bi bi-x-circle me-1"></i>
              Başlatmayı Reddet
            </button>
          }
          
          <button class="btn btn-secondary" (click)="onBack()">
            <i class="bi bi-arrow-left me-1"></i>
            Geri
          </button>
        </div>
      </div>

      @if (loading) {
        <div class="text-center p-5">
          <div class="spinner-border" role="status">
            <span class="visually-hidden">Yükleniyor...</span>
          </div>
        </div>
      } @else if (ders) {

        <!-- Temel Bilgiler -->
        <div class="card shadow-sm mb-4">
          <div class="card-body">
            <app-ders-temel [ders]="ders"></app-ders-temel>
          </div>
        </div>

        <!-- İlişkili Varlıklar -->
        <div class="mt-4">
          <ul ngbNav #nav="ngbNav" [(activeId)]="activeTab" (activeIdChange)="onTabChange($event)" class="nav-tabs">
            <li [ngbNavItem]="'konular'">
              <button ngbNavLink>Konular</button>
            </li>
            <li [ngbNavItem]="'kategoriler'">
              <button ngbNavLink>Kategoriler ({{kategoriler().length}})</button>
            </li>
            <li [ngbNavItem]="'videodersler'">
              <button ngbNavLink>Video Dersler</button>
            </li>
            <li [ngbNavItem]="'yuzyuzedersler'">
              <button ngbNavLink>Yüzyüze Dersler</button>
            </li>            <li [ngbNavItem]="'canlidersler'">
              <button ngbNavLink>Canlı Dersler</button>
            </li>            <li [ngbNavItem]="'dersislemkayitlar'">
              <button ngbNavLink>İşlem Kayıtları</button>
            </li>
          </ul>

          <div class="mt-3">
            <div class="p-3" *ngIf="konularLoaded" [hidden]="activeTab !== 'konular'">
              <app-ders-konu-list 
                [dersId]="ders.id!"
                [bolumlar]="bolumlar()"
                [isLoading]="bolumLoading()"
                (saveBolum)="onSaveBolum($event)"
                (deleteBolum)="onDeleteBolum($event)"
                (saveKonu)="onSaveKonu($event)"
                (deleteKonu)="onDeleteKonu($event)">
              </app-ders-konu-list>
            </div>
            
            <div class="p-3" *ngIf="kategoriLoaded" [hidden]="activeTab !== 'kategoriler'">
              <app-kategori-list
                #kategoriList
                [items]="kategoriler()"
                [isLoading]="kategoriLoading()"
                [isDeleting]="kategoriDeleting()"
                [isAdding]="kategoriAdding()"
                [modalLoading]="kategoriModalLoading()"
                [availableKategoriler]="availableKategoriler()"
                (addRequested)="onKategoriAddRequested()"
                (addConfirmed)="onKategoriAdd($event)"
                (delete)="onKategoriDelete($event)">
              </app-kategori-list>
            </div>
            
            <div class="p-3" *ngIf="videoderslerLoaded" [hidden]="activeTab !== 'videodersler'">
              <app-videoders-list
                [videodersler]="videodersler()"
                [isLoading]="videodersLoading()"
                [errorMessage]="videodersError()"
                (videoSelected)="onVideodersSelect($event)">
              </app-videoders-list>
            </div>

            <div class="p-3" *ngIf="yuzyuzederslerLoaded" [hidden]="activeTab !== 'yuzyuzedersler'">
              <app-yuzyuzeders-list
                [yuzyuzedersler]="yuzyuzedersler()"
                [isLoading]="yuzyuzedersLoading()"
                [errorMessage]="yuzyuzedersError()"
                (videoSelected)="onYuzyuzedersSelect($event)">
              </app-yuzyuzeders-list>
            </div>

            <div class="p-3" *ngIf="canliderslerLoaded" [hidden]="activeTab !== 'canlidersler'">
              <app-canliders-list
                [canlidersler]="canlidersler()"
                [isLoading]="canlidersLoading()"
                [errorMessage]="canlidersError()"
                (canlidersSelected)="onCanlidersSelect($event)">
              </app-canliders-list>
            </div>
            
            <div class="p-3" *ngIf="islemlerLoaded" [hidden]="activeTab !== 'dersislemkayitlar'">
              <app-islem-kayit-list
                [items]="islemKayitlar()"
                [isLoading]="islemKayitLoading()"
                [useStyledVersion]="false">
              </app-islem-kayit-list>
            </div>
          </div>
        </div>
      } @else {
        <div class="alert alert-warning">
          Ders bulunamadı.
        </div>
      }
    </div>
  </div>
</div>
