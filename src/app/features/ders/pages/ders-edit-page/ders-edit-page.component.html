<div class="container-fluid">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div class="d-flex align-items-center gap-3">
      <h5 class="mb-0">{{ isEditMode ? 'Ders Düzenle' : 'Yeni Ders' }}</h5>
      @if (formDirty && !isSaving) {
        <span class="badge bg-warning text-dark badge-unsaved">
          <i class="bi bi-exclamation-circle me-1"></i>Kaydedilmemiş Değişiklikler
        </span>
      }
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      @if (ders || !isEditMode) {
        <app-ders-form
          [initialData]="ders"
          [isSaving]="isSaving"
          (save)="onSave($event)"
          (formCancel)="onCancel()"
          (formDirtyChange)="onFormDirtyChange($event)">
        </app-ders-form>
      }
    </div>
  </div>
</div>
