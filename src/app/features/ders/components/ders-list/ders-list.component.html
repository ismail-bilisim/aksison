<table class="table table-bordered">
    <thead>
        <tr>
            <th>Kodu</th>
            <th>Adı</th>
            <th>Sürüm</th>
            <th>Onay Durumu</th>
            <th>Tahmini Süre (dk)</th>
            <th>İşlemler</th>
        </tr>
    </thead>
    <tbody>
        @for (ders of dersler; track ders.id) {
        <tr class="table-row-hover">
            <td>{{ ders.kodu }}</td>
            <td>{{ ders.adi }}</td>
            <td>{{ ders.icerikSurum }}</td>
            <td>{{ ders.onayDurumu }}</td>
            <td>{{ ders.tahminiDersSuresi }}</td>
            <td style="cursor: pointer;">
                <button (click)="onViewDetail(ders)" class="btn btn-sm btn-primary me-1">Detay</button>
                <button (click)="onEdit(ders)" class="btn btn-sm btn-primary me-1">Düzenle</button>
                <button (click)="onDelete(ders.id!)" class="btn btn-sm btn-danger">Sil</button>
            </td>
        </tr>
        } @empty {
        <tr>
            <td colspan="6" class="text-center">Kayıt bulunamadı.</td>
        </tr>
        }
    </tbody>
</table>

<style>
.table-row-hover:hover {
    background-color: #f8f9fa;
}
</style>
