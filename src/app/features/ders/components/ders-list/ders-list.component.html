<div class="table-responsive">
    <table class="table table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>Kodu</th>
                <th>Adı</th>
            </tr>
        </thead>
        <tbody>
            @for (ders of dersler; track ders.id) {
            <tr class="table-row-hover clickable-row"
                role="button"
                tabindex="0"
                (click)="onRowClick(ders.id!)"
                (keydown.enter)="onRowClick(ders.id!)"
                title="Detayları görüntülemek için tıklayın">
                <td><strong>{{ ders.kodu }}</strong></td>
                <td>{{ ders.adi }}</td>
            </tr>
            } @empty {
            <tr>
                <td colspan="2" class="text-center py-4">
                    <div class="text-muted">
                        <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                        Kayıt bulunamadı.
                    </div>
                </td>
            </tr>
            }
        </tbody>
    </table>

</div>
