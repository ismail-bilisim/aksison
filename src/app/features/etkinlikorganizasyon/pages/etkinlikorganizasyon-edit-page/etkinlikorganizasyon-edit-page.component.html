<div class="container mt-4">
    @if (isEditMode) {
    <h5 class="mb-3">Etkinliği Düzenle</h5>
    } @else {
    <h5 class="mb-3">Yeni Etkinlik Ekle</h5>
    }

    @if (isLoadingLookups()) {
        <div class="alert alert-info">
            <i class="bi bi-hourglass-split me-2"></i>Lookup verileri yükleniyor...
        </div>
    }

    <section class="card p-4 shadow-sm border-0">
        <app-etkinlikorganizasyon-form
            [initialData]="etkinlikRequest()"
            [lookupData]="lookupData()"
            [isEditMode]="isEditMode"
            (save)="onSave($event)">
        </app-etkinlikorganizasyon-form>
    </section>

    <div class="mt-4 d-flex justify-content-end">
        <a routerLink="/etkinlikorganizasyon" class="btn btn-outline-secondary">
            ← Listeye Dön
        </a>
    </div>
</div>
