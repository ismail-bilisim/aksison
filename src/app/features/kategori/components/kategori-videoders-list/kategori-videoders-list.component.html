<div class="d-flex justify-content-between align-items-center mb-3">
  <h5>Video Dersler</h5>
</div>

@if (loading) {
  <div class="text-center p-3">
    <div class="spinner-border spinner-border-sm" role="status">
      <span class="visually-hidden">Yükleniyor...</span>
    </div>
  </div>
} @else if (videodersler.length === 0) {
  <div class="alert alert-info text-center">
    <i class="bi bi-camera-video-off fs-3 d-block mb-2"></i>
    <p class="mb-0">Bu kategoriye ait video ders bulunmamaktadır.</p>
  </div>
} @else {
  <div class="table-responsive">
    <table class="table table-hover">
      <thead class="table-light">
        <tr>
          <th>Video Ders Kodu</th>
          <th>Video Ders Adı</th>
          <th>İşlem</th>
        </tr>
      </thead>
      <tbody>
        @for (videoders of videodersler; track videoders.id) {
          <tr>
            <td>{{ videoders.kodu }}</td>
            <td>{{ videoders.adi }}</td>
            <td>
              <button class="btn btn-sm btn-outline-primary" 
                      (click)="navigateToVideoders(videoders.id)">
                <i class="bi bi-eye me-1"></i>
                Görüntüle
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}
