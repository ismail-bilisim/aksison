<div class="d-flex justify-content-between align-items-center mb-3">
  <h5>Eğitmenler</h5>
</div>

@if (loading) {
  <div class="text-center p-3">
    <div class="spinner-border spinner-border-sm" role="status">
      <span class="visually-hidden">Yükleniyor...</span>
    </div>
  </div>
} @else if (egitmenler.length === 0) {
  <div class="alert alert-info text-center">
    <i class="bi bi-person-x fs-3 d-block mb-2"></i>
    <p class="mb-0">Bu kategoriye ait eğitmen bulunmamaktadır.</p>
  </div>
} @else {
  <div class="row">
    @for (egitmen of egitmenler; track egitmen.id) {
      <div class="col-md-6 col-lg-4 mb-3">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h6 class="card-title text-primary">
              <i class="bi bi-person-badge me-2"></i>
              {{ egitmen.kullanici?.ad }} {{ egitmen.kullanici?.soyad }}
            </h6>
            <p class="card-text text-muted small mb-0">
              <i class="bi bi-hash me-1"></i>Kod: {{ egitmen.kod }}
            </p>
          </div>
        </div>
      </div>
    }
  </div>
}
