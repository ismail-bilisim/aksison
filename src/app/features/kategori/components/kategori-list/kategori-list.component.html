<div class="list-container">
  @if (kategoriler && kategoriler.length > 0) {
    <div class="list-header">
      <span class="list-count">
        <i class="bi bi-tags me-1"></i>
        {{ kategoriler.length }} kategori
      </span>
    </div>
    <div class="list-items">
      @for (kategori of kategoriler; track kategori.id) {
        <div class="list-item" 
             role="button"
             tabindex="0"
             (click)="onKategoriClick(kategori.id)"
             (keydown.enter)="onKategoriClick(kategori.id)">
          <div class="item-icon">
            <i class="bi bi-tag"></i>
          </div>
          <div class="item-content">
            <div class="item-title">
              @if (kategori.kodu) {
                <span class="item-code">{{ kategori.kodu }}</span>
              }
              {{ kategori.adi }}
            </div>
          </div>
          <div class="item-action">
            <i class="bi bi-chevron-right"></i>
          </div>
        </div>
      }
    </div>
  } @else {
    <div class="empty-state">
      <i class="bi bi-tags"></i>
      <p>Kategori bulunamadı.</p>
    </div>
  }
</div>
