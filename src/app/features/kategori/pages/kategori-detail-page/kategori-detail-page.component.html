<div class="container-fluid">
  <div class="row">
    <div class="col">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h5>Kategori Detayı</h5>
          @if (breadcrumbs.length > 0) {
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb mb-0">
                @for (crumb of breadcrumbs; track crumb.id; let isLast = $last) {
                  <li class="breadcrumb-item" [class.active]="isLast">
                    @if (!isLast && crumb.id) {
                      <a href="javascript:void(0)" (click)="navigateToKategori(crumb.id)" class="text-decoration-none">
                        <i class="bi bi-tag me-1"></i>{{ crumb.adi }}
                      </a>
                    } @else {
                      <i class="bi bi-tag-fill me-1"></i>{{ crumb.adi }}
                    }
                  </li>
                }
              </ol>
            </nav>
          }
        </div>
        <div>
          <button class="btn btn-secondary" (click)="onBack()">
            <i class="bi bi-arrow-left me-1"></i>
            Geri
          </button>
        </div>
      </div>

      @if (loading) {
        <div class="text-center p-5">
          <div class="spinner-border" role="status">
            <span class="visually-hidden">Yükleniyor...</span>
          </div>
        </div>
      } @else if (kategori) {

        <app-kategori-temel [kategori]="kategori"></app-kategori-temel>

        <!-- İlişkili Varlıklar -->
        <div class="mt-4">
          <ul ngbNav #nav="ngbNav" [(activeId)]="activeTab" (activeIdChange)="onTabChange($event)" class="nav-tabs">
            <li [ngbNavItem]="'altKategoriler'">
              <button ngbNavLink>Alt Kategoriler</button>
              <ng-template ngbNavContent>
                <app-kategori-alt-kategori-list [kategoriId]="kategori.id!"></app-kategori-alt-kategori-list>
              </ng-template>
            </li>
            <li [ngbNavItem]="'dersler'">
              <button ngbNavLink>Dersler</button>
              <ng-template ngbNavContent>
                <app-kategori-ders-list [kategoriId]="kategori.id!"></app-kategori-ders-list>
              </ng-template>
            </li>
            <li [ngbNavItem]="'videodersler'">
              <button ngbNavLink>Video Dersler</button>
              <ng-template ngbNavContent>
                <app-videoders-list 
                  [videodersler]="videodersler()"
                  [isLoading]="videodersLoading()"
                  [errorMessage]="videodersError()"
                  (select)="onVideodersSelect($event)">
                </app-videoders-list>
              </ng-template>
            </li>
            <li [ngbNavItem]="'yuzyuzedersler'">
              <button ngbNavLink>Yüz Yüze Dersler</button>
              <ng-template ngbNavContent>
                <app-yuzyuzeders-list 
                  [yuzyuzedersler]="yuzyuzedersler()"
                  [isLoading]="yuzyuzedersLoading()"
                  [errorMessage]="yuzyuzedersError()"
                  (select)="onYuzyuzedersSelect($event)">
                </app-yuzyuzeders-list>
              </ng-template>
            </li>
            <li [ngbNavItem]="'egitmenler'">
              <button ngbNavLink>Eğitmenler</button>
              <ng-template ngbNavContent>
                <app-kategori-egitmen-list [kategoriId]="kategori.id!"></app-kategori-egitmen-list>
              </ng-template>
            </li>
          </ul>

          <div [ngbNavOutlet]="nav" class="mt-3"></div>
        </div>
      } @else {
        <div class="alert alert-warning">
          Kategori bulunamadı.
        </div>
      }
    </div>
  </div>
</div>
