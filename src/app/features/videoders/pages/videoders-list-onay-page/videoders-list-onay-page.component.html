<div class="d-flex justify-content-between align-items-center mb-3">
	<h5>
		<i class="bi {{ pageIcon() }} me-2 text-primary"></i>
		{{ pageTitle() }}
	</h5>
	<a routerLink="/videoders" class="btn btn-outline-secondary btn-sm">
		<i class="bi bi-arrow-left me-1"></i>Tüm Dersler
	</a>
</div>

@if (isLoading()) {
	<div class="text-center py-4">
		<div class="spinner-border" role="status">
			<span class="visually-hidden">Yükleniyor...</span>
		</div>
	</div>
} @else {
	<app-videoders-list
		[videodersler]="(videodersler$ | async) ?? []"
		(viewDetail)="viewDetail($event)">
	</app-videoders-list>
}
