<div class="container-fluid">
    <div class="row">
        <div class="col">
            @if (loading) {
            <div class="text-center">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Yükleniyor...</span>
                </div>
            </div>
            } @else if (videoders) {

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h5 class="mb-0">Video Ders Detayı</h5>
                <button class="btn btn-primary" (click)="onEdit(videoders.id)">
                    <i class="bi bi-pencil me-1"></i> Düzenle
                </button>
            </div>

            <section class="mb-4">
                <h4 class="text-primary mb-3">
                    <i class="bi bi-info-square me-2"></i>Temel Bilgiler
                </h4>
                <app-videoders-temel [videoders]="videoders"></app-videoders-temel>
            </section>

            <section class="mb-4">
                <h4 class="text-primary mb-3">
                    <i class="bi bi-file-text me-2"></i>Ders Özeti
                </h4>
                <app-videoders-ozet [videoders]="videoders"></app-videoders-ozet>
            </section>

            <section class="mb-4">
                <h4 class="text-primary mb-3">
                    <i class="bi bi-people me-2"></i>Sorumlular
                </h4>
                <app-videoders-sorumlular [dersId]="videoders.id"></app-videoders-sorumlular>
            </section>

            <section class="mb-4">
                <h4 class="text-primary mb-3">
                    <i class="bi bi-currency-dollar me-2"></i>Ücret Bilgisi
                </h4>
                <app-videoders-ucret [videoders]="videoders"></app-videoders-ucret>
            </section>

            <section class="mb-4">
                <h4 class="text-primary mb-3">
                    <i class="bi bi-list-check me-2"></i>Ön Koşullar
                </h4>
                <app-videoders-onkosul-list [dersId]="videoders.id"></app-videoders-onkosul-list>
            </section>

            <section class="mt-5">
                <h4 class="text-primary mb-3">
                    <i class="bi bi-diagram-3 me-2"></i>İlişkili Varlıklar
                </h4>
                <ul ngbNav #nav="ngbNav" [(activeId)]="activeTab" class="nav-tabs">
                    <li [ngbNavItem]="'konular'">
                        <button ngbNavLink>Konular</button>
                        <ng-template ngbNavContent>
                        </ng-template>
                    </li>
                    <li [ngbNavItem]="'kategoriler'">
                        <button ngbNavLink>Kategoriler</button>
                        <ng-template ngbNavContent>
                            <app-videoders-kategori-list [dersId]="videoders.id!"></app-videoders-kategori-list>
                        </ng-template>
                    </li>
                    <li [ngbNavItem]="'projeler'">
                        <button ngbNavLink>Projeler</button>
                        <ng-template ngbNavContent>
                            <app-videoders-proje-list [dersId]="videoders.id!"></app-videoders-proje-list>
                        </ng-template>
                    </li>
                    <li [ngbNavItem]="'paydaslar'">
                        <button ngbNavLink>Paydaşlar</button>
                        <ng-template ngbNavContent>
                            <app-videoders-paydas-list [dersId]="videoders.id!"></app-videoders-paydas-list>
                        </ng-template>
                    </li>
                    <li [ngbNavItem]="'sozlesmeler'">
                        <button ngbNavLink>Sözleşmeler</button>
                        <ng-template ngbNavContent>
                            <app-videoders-sozlesme-list [dersId]="videoders.id!"></app-videoders-sozlesme-list>
                        </ng-template>
                    </li>
                    <li [ngbNavItem]="'sorular'">
                        <button ngbNavLink>Sorular</button>
                        <ng-template ngbNavContent>
                            <!-- Sorular içeriği -->
                        </ng-template>
                    </li>
                    <li [ngbNavItem]="'islemler'">
                        <button ngbNavLink>İşlem Kayıtları</button>
                        <ng-template ngbNavContent>
                            <app-videoders-islem-kayit-list [dersId]="videoders.id!"></app-videoders-islem-kayit-list>
                        </ng-template>
                    </li>
                </ul>
                <div [ngbNavOutlet]="nav" class="mt-3"></div>
            </section>

            } @else {
            <div class="alert alert-warning mt-3">
                Video ders bulunamadı.
            </div>
            }
        </div>
    </div>
</div>
