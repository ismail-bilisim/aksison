<div class="container-fluid">
  <div class="row">
    <div class="col">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>{{ pageTitle }}</h2>
        <button class="btn btn-primary" (click)="onNewVideoders()">
          <i class="bi bi-plus-circle me-1"></i>
          Yeni Video Ders
        </button>
      </div>
      
      <app-videoders-list 
        [videodersler]="videodersler"
        (edit)="onEdit($event)"
        (delete)="onDelete($event)"
        (viewDetail)="onViewDetail($event)">
      </app-videoders-list>
    </div>
  </div>
</div>
