<div class="container-fluid">
  <div class="row">
    <div class="col">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="d-flex align-items-center gap-3">
          <h5 class="mb-0">{{ pageTitle }}</h5>
          <span class="badge bg-primary">{{ videodersler.length }}</span>
        </div>
        <button class="btn btn-primary" (click)="onNewVideoders()" [disabled]="loading">
          <i class="bi bi-plus-circle me-1"></i>
          Yeni Video Ders
        </button>
      </div>

      @if (loading) {
        <div class="text-center py-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Yükleniyor...</span>
          </div>
          <p class="mt-3 text-muted">Yükleniyor...</p>
        </div>
      }

      @if (error) {
        <div class="alert alert-danger" role="alert">
          <i class="bi bi-exclamation-triangle me-2"></i>
          {{ error }}
        </div>
      }

      @if (!loading && !error) {
        <app-videoders-list 
          [videodersler]="videodersler"
          (viewDetail)="viewDetail($event)">
        </app-videoders-list>
      }
    </div>
  </div>
</div>
