<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <!-- Ders Seçimi -->
    <div class="mb-3">
        <h6 class="mt-3 text-primary">Ders Seçimi</h6>
        <div class="row">
            <div class="col-md-12 mb-3">
                <label class="form-label">Ders Seç *</label>
                <select formControlName="dersId" class="form-select" [class.is-invalid]="form.get('dersId')?.invalid && form.get('dersId')?.touched">
                    <option value="">Seçiniz</option>
                    @if (loadingDers) {
                        <option disabled>Yükleniyor...</option>
                    }
                    @for (ders of dersler; track ders.id) {
                        <option [value]="ders.id">{{ ders.kodu }} - {{ ders.adi }}</option>
                    }
                </select>
                @if (form.get('dersId')?.invalid && form.get('dersId')?.touched) {
                    <div class="text-danger small">Ders seçimi zorunludur.</div>
                }
            </div>
        </div>
    </div>

    <!-- Temel Bilgiler -->
    <div class="mb-3">
        <h6 class="mt-3 text-primary">Temel Bilgiler</h6>
        <div class="row">
            <div class="col-md-12 mb-3">
                <label class="form-label">Adı *</label>
                <input formControlName="adi" class="form-control" />
                @if (form.get('adi')?.invalid && form.get('adi')?.touched) {
                    <div class="text-danger small">Ders adı zorunludur</div>
                }
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Amacı</label>
            <textarea formControlName="amaci" class="form-control" rows="3"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Özeti</label>
            <textarea formControlName="dersOzeti" class="form-control" rows="4"></textarea>
        </div>
    </div>

    <!-- Ders Detayları -->
    <div class="mb-3">
        <h6 class="mt-3 text-primary">Ders Detayları</h6>
        <div class="row">
            <div class="col-md-3 mb-3">
                <label class="form-label">Ders Türü</label>
                <select formControlName="turuKodu" class="form-select">
                    <option value="">Seçiniz</option>
                    @if (loadingDersTuru) {
                        <option disabled>Yükleniyor...</option>
                    }
                    @for (tur of dersTurleri; track tur.kodu) {
                        <option [value]="tur.kodu">{{ tur.adi }}</option>
                    }
                </select>
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">Seviye</label>
                <select formControlName="seviyesiKodu" class="form-select">
                    <option value="">Seçiniz</option>
                    @if (loadingDersSeviyesi) {
                        <option disabled>Yükleniyor...</option>
                    }
                    @for (sev of dersSeviyeleri; track sev.kodu) {
                        <option [value]="sev.kodu">{{ sev.adi }}</option>
                    }
                </select>
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">Nitelik</label>
                <select formControlName="niteligiKodu" class="form-select">
                    <option value="">Seçiniz</option>
                    @if (loadingDersNiteligi) {
                        <option disabled>Yükleniyor...</option>
                    }
                    @for (nit of dersNitelikleri; track nit.kodu) {
                        <option [value]="nit.kodu">{{ nit.adi }}</option>
                    }
                </select>
            </div>
        </div>
    </div>

    <!-- Tarih ve Süre Bilgileri -->
    <div class="mb-3">
        <h6 class="mt-3 text-primary">Tarih ve Süre Bilgileri</h6>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Tahmini Ders Süresi (dk)</label>
                <input type="number" formControlName="tahminiDersSuresi" class="form-control" />
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Başlama Tarihi</label>
                <input type="date" formControlName="baslamaTarihi" class="form-control" />
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Tahmini Teslim Tarihi</label>
                <input type="date" formControlName="tahminiDersTeslimTarihi" class="form-control" />
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Ders Çekim Yöntemi</label>
                <select formControlName="dersCekimYontemiKodu" class="form-select">
                    <option value="">Seçiniz</option>
                    @if (loadingDersCekimYontemi) {
                        <option disabled>Yüklenİyor...</option>
                    }
                    @for (yontem of dersCekimYontemleri; track yontem.kodu) {
                        <option [value]="yontem.kodu">{{ yontem.adi }}</option>
                    }
                </select>
            </div>
        </div>
    </div>

    <!-- Hedef Kitle ve İçerik -->
    <div class="mb-3">
        <h6 class="mt-3 text-primary">Hedef Kitle ve İçerik Bilgileri</h6>
        <div class="mb-3">
            <label class="form-label">Hedef Kitle Eğitim Seviyesi</label>
            <select formControlName="hedefKitleEgitimSeviyeKodu" class="form-select">
                <option value="">Seçiniz</option>
                @if (loadingHedefKitleEgitimSeviyesi) {
                    <option disabled>Yüklenİyor...</option>
                }
                @for (seviye of hedefKitleEgitimSeviyeleri; track seviye.kodu) {
                    <option [value]="seviye.kodu">{{ seviye.adi }}</option>
                }
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">İlgi Alanına Göre Hedef Kitle</label>
            <textarea formControlName="ilgiAlaninaGoreHedefKitle" class="form-control" rows="2"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Kullanılacak Programlar</label>
            <textarea formControlName="kullanilacakProgramlar" class="form-control" rows="2"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Kazanımlar</label>
            <textarea formControlName="kazanimlar" class="form-control" rows="3"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Sıkça Sorulan Sorular</label>
            <textarea formControlName="sikcaSorulanSorular" class="form-control" rows="3"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Portal Adresi</label>
            <input type="url" formControlName="portalAdresi" class="form-control" />
        </div>
    </div>

    <!-- Finansal Bilgiler -->
    <div class="mb-3">
        <h6 class="mt-3 text-primary">Finansal Bilgiler</h6>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Birim Ücret</label>
                <input type="number" step="0.01" formControlName="birimUcret" class="form-control" />
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Toplam Ücret</label>
                <input type="number" step="0.01" formControlName="toplamUcret" class="form-control" />
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Ödeme Kaynak</label>
                <input formControlName="odemeKaynak" class="form-control" />
            </div>
        </div>
    </div>

    <!-- Form Actions -->
    <div class="text-end">
        <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
            <i class="bi bi-save me-2"></i>Kaydet
        </button>
    </div>
</form>
