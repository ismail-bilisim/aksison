<div class="table-responsive">
    <table class="table table-hover align-middle">
        <thead class="table-dark">
            <tr>
                <th>Adı</th>
                <th>Detay</th>
            </tr>
        </thead>
        <tbody>
            @for (v of videodersler; track v.id) {
            <tr (click)="onViewDetail(v.id!)" 
                title="Detayları görüntülemek için tıklayın">
                <td> <strong>{{ v.kodu }}</strong> {{ v.adi }}</td>
                <td class="text-end">
                    <button class="btn btn-sm btn-outline-primary" (click)="onViewDetail(v.id!); $event.stopPropagation()" title="Görüntüle">
                        <i class="bi bi-eye"></i>
                    </button>
                </td>
            </tr>
            } @empty {
            <tr>
                <td colspan="3" class="text-center py-4">
                    <div class="text-muted">
                        <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                        Kayıt bulunamadı.
                    </div>
                </td>
            </tr>
            }
        </tbody>
    </table>
</div>
