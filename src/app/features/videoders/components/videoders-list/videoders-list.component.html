<table class="table table-bordered">
    <thead>
        <tr>
            <th>Kodu</th>
            <th>Adı</th>
            <th>Durum</th>
            <th>Onay Durumu</th>
            <th>Başlama Tarihi</th>
            <th>Birim Ücret</th>
            <th>Ödeme Kaynak</th>
            <th>İşlemler</th>
        </tr>
    </thead>
    <tbody>
        @for (v of videodersler; track v.kodu) {
        <tr class="table-row-hover">
            <td>{{ v.kodu }}</td>
            <td>{{ v.adi }}</td>
            <td>{{ v.durumKodu }}</td>
            <td>{{ v.onayDurumu }}</td>
            <td>{{ v.baslamaTarihi }}</td>
            <td>{{ v.birimUcret }}</td>
            <td>{{ v.odemeKaynak }}</td>
            <td  style="cursor: pointer;" >
                <button (click)="onViewDetail(v)" class="btn btn-sm btn-primary me-1">Detay</button>
                <button (click)="onEdit(v)" class="btn btn-sm btn-primary me-1">Düzenle</button>
                <button (click)="onDelete(v.kodu!)" class="btn btn-sm btn-danger">Sil</button>
            </td>
        </tr>
        } @empty {
        <tr>
            <td colspan="8" class="text-center">Kayıt bulunamadı.</td>
        </tr>
        }
    </tbody>
</table>

<style>
.table-row-hover:hover {
    background-color: #f8f9fa;
}
</style>
