<div class="soru-list">
  <!-- Empty State -->
  <div *ngIf="sorular.length === 0" class="empty-state p-5 text-center">
    <div class="empty-icon mb-3">
      <i class="bi bi-question-circle" style="font-size: 3rem; color: #6c757d;"></i>
    </div>
    <p class="empty-text text-muted mb-3">Bu derse henüz soru eklenmemiş</p>
    <button class="btn btn-primary" (click)="openSoruModal()">
      <i class="bi bi-plus-circle me-2"></i>Soru Ekle
    </button>
  </div>

  <!-- Sorular List -->
  <div *ngIf="sorular.length > 0">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h6 class="mb-0">Sorular ({{sorular.length}})</h6>
      <button class="btn btn-sm btn-primary" (click)="openSoruModal()">
        <i class="bi bi-plus-circle me-1"></i>Soru Ekle
      </button>
    </div>

    <div class="list-group">
      <div *ngFor="let soru of sorular; let i = index" class="list-group-item">
        <div class="d-flex justify-content-between align-items-start">
          <div class="flex-grow-1">
            <div class="d-flex align-items-center mb-2">
              <span class="badge bg-primary me-2">{{i + 1}}</span>
              <span class="badge bg-info me-2">{{getSoruTipiLabel(soru.soru.soruTipi)}}</span>
              <span class="badge bg-secondary" *ngIf="soru.konuId">Konuya Bağlı</span>
              <span class="badge bg-warning text-dark" *ngIf="!soru.konuId">Genel Soru</span>
            </div>
            <p class="mb-1">{{soru.soru.soruMetni}}</p>
            <small class="text-muted">ID: {{soru.soru.id}}</small>
          </div>
          <button class="btn btn-sm btn-outline-danger ms-2" 
                  (click)="deleteSoru(soru)"
                  title="Soruyu sil">
            <i class="bi bi-trash"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Soru Modal -->
<ng-template #soruModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title">Yeni Soru Ekle</h5>
    <button type="button" class="btn-close" (click)="modal.dismiss()"></button>
  </div>
  <div class="modal-body">
    <form [formGroup]="soruForm">
      <!-- Question Info Section -->
      <div class="mb-4">
        <h6 class="text-primary mb-3">Soru Bilgileri</h6>
        
        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label">Soru Tipi <span class="text-danger">*</span></label>
            <select class="form-select" formControlName="soruTipi">
              <option value="">Seçiniz...</option>
              <option *ngFor="let tip of soruTipleri" [value]="tip.kod">{{tip.label}}</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Zorluk Derecesi <span class="text-danger">*</span></label>
            <select class="form-select" formControlName="zorlukDerecesi">
              <option value="">Seçiniz...</option>
              <option *ngFor="let derece of zorlukDereceleri" [value]="derece.kod">{{derece.label}}</option>
            </select>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Soru Metni <span class="text-danger">*</span></label>
          <textarea class="form-control" 
                    formControlName="soruMetni"
                    rows="3"
                    maxlength="1000"
                    placeholder="Soru metnini girin..."></textarea>
          <small class="form-text text-muted">
            {{soruForm.get('soruMetni')?.value?.length || 0}}/1000 karakter
          </small>
        </div>
      </div>

      <!-- Options Section -->
      <div class="mb-4">
        <h6 class="text-primary mb-3">Seçenekler</h6>
        
        <div class="mb-3">
          <label class="form-label">Seçenek Sayısı <span class="text-danger">*</span></label>
          <select class="form-select" formControlName="secenekSayisi">
            <option *ngFor="let sayi of secenekSayilari" [value]="sayi">{{sayi}} Seçenek</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Seçenek 1 <span class="text-danger">*</span></label>
          <input type="text" 
                 class="form-control" 
                 formControlName="secenek1"
                 maxlength="1000"
                 placeholder="Birinci seçenek">
        </div>

        <div class="mb-3">
          <label class="form-label">Seçenek 2 <span class="text-danger">*</span></label>
          <input type="text" 
                 class="form-control" 
                 formControlName="secenek2"
                 maxlength="1000"
                 placeholder="İkinci seçenek">
        </div>

        <div class="mb-3" *ngIf="soruForm.get('secenekSayisi')?.value >= 3">
          <label class="form-label">Seçenek 3 <span class="text-danger">*</span></label>
          <input type="text" 
                 class="form-control" 
                 formControlName="secenek3"
                 maxlength="1000"
                 placeholder="Üçüncü seçenek">
        </div>

        <div class="mb-3" *ngIf="soruForm.get('secenekSayisi')?.value >= 4">
          <label class="form-label">Seçenek 4 <span class="text-danger">*</span></label>
          <input type="text" 
                 class="form-control" 
                 formControlName="secenek4"
                 maxlength="1000"
                 placeholder="Dördüncü seçenek">
        </div>
      </div>

      <!-- Correct Answer Section -->
      <div class="mb-4">
        <h6 class="text-primary mb-3">Doğru Cevap</h6>
        
        <div class="mb-3">
          <label class="form-label">Doğru Seçenek <span class="text-danger">*</span></label>
          <select class="form-select" formControlName="dogruSecenek">
            <option *ngFor="let i of [1, 2, 3, 4]" 
                    [value]="i" 
                    [disabled]="i > soruForm.get('secenekSayisi')?.value">
              Seçenek {{i}}
            </option>
          </select>
        </div>
      </div>

    </form>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="modal.dismiss()">İptal</button>
    <button type="button" 
            class="btn btn-primary" 
            (click)="saveSoru()"
            [disabled]="soruForm.invalid">
      Kaydet
    </button>
  </div>
</ng-template>
