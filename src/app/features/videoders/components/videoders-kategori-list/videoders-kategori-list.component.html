<div class="d-flex justify-content-between align-items-center mb-3">
    <h5>Kategoriler</h5>
    <button class="btn btn-outline-primary btn-sm" (click)="onAdd()">
        <i class="bi bi-plus"></i>
        Ekle
    </button>
</div>

<!-- Kategori listesi -->
<div *ngIf="loading" class="text-center">
    <div class="spinner-border spinner-border-sm" role="status">
        <span class="visually-hidden">Yükleniyor...</span>
    </div>
</div>

<div *ngIf="!loading && items.length === 0" class="alert alert-info">
    Henüz kategori eklenmemiş.
</div>

<div *ngIf="!loading && items.length > 0" class="row">
    <div *ngFor="let item of items" class="col-md-4 col-lg-3 mb-3">
        <div class="card h-100 shadow-sm">
            <div class="card-body d-flex flex-column">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <h6 class="card-title mb-0 text-primary">
                        <i class="bi bi-tag me-2"></i>
                        {{ item.adi }}
                    </h6>
                            <button class="dropdown-item text-danger text-end" 
                                    (click)="onDelete(item)" 
                                    [disabled]="deleting">
                                <i class="bi bi-trash me-2"></i>
                                Kaldır
                            </button>
                </div>
                <div class="mt-auto">
                    <small class="text-muted">
                        <i class="bi bi-info-circle me-1"></i>
                        Kategori ID: {{ item.kategoriId || item.id }}
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Kategori Ekleme Modal -->
<ng-template #kategoriModal let-modal>
    <div class="modal-header">
        <h4 class="modal-title">Kategori Ekle</h4>
        <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss()">
        </button>
    </div>
    
    <div class="modal-body">
        <div *ngIf="modalLoading" class="text-center">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Kategoriler yükleniyor...</span>
            </div>
        </div>
        
        <div *ngIf="!modalLoading">
            <div *ngIf="availableKategoriler.length === 0" class="alert alert-info">
                Tüm kategoriler zaten eklenmiş. Eklenebilecek kategori bulunmamaktadır.
            </div>
            
            <div *ngIf="availableKategoriler.length > 0">
                <p>Eklemek istediğiniz kategorileri seçin:</p>
                <div class="list-group">
                    <label *ngFor="let kategori of availableKategoriler" 
                           class="list-group-item list-group-item-action">
                        <div class="form-check">
                            <input class="form-check-input" 
                                   type="checkbox" 
                                   [checked]="isKategoriSelected(kategori.id!)"
                                   (change)="toggleKategoriSelection(kategori.id!)">
                            <span class="form-check-label">
                                {{ kategori.adi }}
                            </span>
                        </div>
                    </label>
                </div>
            </div>
        </div>
    </div>
    
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="modal.dismiss()">
            İptal
        </button>
        <button type="button" 
                class="btn btn-primary" 
                (click)="addSelectedKategoriler()"
                [disabled]="selectedKategoriler.length === 0 || adding">
            <span *ngIf="adding" class="spinner-border spinner-border-sm me-2" role="status"></span>
            Ekle ({{ selectedKategoriler.length }})
        </button>
    </div>
</ng-template>
