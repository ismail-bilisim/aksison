<div class="container mt-4">
    @if (isEditMode) {
    <h5 class="mb-3">Yüzyüze Dersi Düzenle</h5>
    } @else {
    <h5 class="mb-3">Yeni Yüzyüze Dersi Ekle</h5>
    }

    @if (isLoadingLookups()) {
        <div class="alert alert-info">
            <i class="bi bi-hourglass-split me-2"></i>Lookup verileri yükleniyor...
        </div>
    }

    @if (isLoadingDersDetay()) {
        <div class="alert alert-info">
            <i class="bi bi-hourglass-split me-2"></i>Ders detayı yükleniyor...
        </div>
    }

    <section class="card p-4 shadow-sm border-0">
        <app-yuzyuzeders-form 
            [initialData]="yuzyuzedersRequest()" 
            [lookupData]="lookupData()"
            [isEditMode]="isEditMode"
            (save)="onSave($event)"
            (dersSelected)="onDersSelected($event)">
        </app-yuzyuzeders-form>
    </section>

    <div class="mt-4 d-flex justify-content-end">
        <a routerLink="/yuzyuzeders" class="btn btn-outline-secondary">
            ← Listeye Dön
        </a>
    </div>
</div>
