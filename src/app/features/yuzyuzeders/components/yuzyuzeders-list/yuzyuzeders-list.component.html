<div class="list-container">
  @if (yuzyuzedersler && yuzyuzedersler.length > 0) {
    <div class="list-header">
      <span class="list-count">
        <i class="bi bi-people me-1"></i>
        {{ yuzyuzedersler.length }} yüz yüze ders
      </span>
    </div>
    <div class="list-items">
      @for (y of yuzyuzedersler; track y.id) {
        <div class="list-item" 
             role="button"
             tabindex="0"
             (click)="onViewDetail(y.id!)"
             (keydown.enter)="onViewDetail(y.id!)">
          <div class="item-icon">
            <i class="bi bi-people"></i>
          </div>
          <div class="item-content">
            <div class="item-title">
              @if (y.kodu) {
                <span class="item-code">{{ y.kodu }}</span>
              }
              {{ y.adi }}
            </div>
          </div>
          <div class="item-action">
            <i class="bi bi-chevron-right"></i>
          </div>
        </div>
      }
    </div>
  } @else {
    <div class="empty-state">
      <i class="bi bi-people"></i>
      <p>Yüz yüze ders bulunamadı.</p>
    </div>
  }
</div>
