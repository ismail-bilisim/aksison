<div class="list-container">
  @if (kullanicilar.length) {
    <div class="list-header">
      <span class="list-count">
        <i class="bi bi-people me-1"></i>
        {{ kullanicilar.length }} kullanıcı
      </span>
    </div>
    <div class="list-items">
      @for (k of kullanicilar; track trackById($index, k)) {
        <div class="list-item" 
             role="button"
             tabindex="0"
             (click)="onRowClick(k, $event)"
             (keydown.enter)="onRowClick(k, $event)">
          <div class="item-icon">
            <i class="bi bi-person"></i>
          </div>
          <div class="item-content">
            <div class="item-title">
              <span class="item-name">{{ k.ad }} {{ k.soyad }}</span>
              <span [class]="k.aktifMi ? 'badge bg-success' : 'badge bg-secondary'">
                {{ k.aktifMi ? 'Aktif' : 'Pasif' }}
              </span>
            </div>
            <div class="item-details">
              @if (k.kullaniciAdi) {
                <span class="detail-item">
                  <i class="bi bi-person-badge me-1"></i>{{ k.kullaniciAdi }}
                </span>
              }
              @if (k.ePosta) {
                <span class="detail-item">
                  <i class="bi bi-envelope me-1"></i>{{ k.ePosta }}
                </span>
              }
            </div>
          </div>
          <div class="item-actions">
            <button (click)="onEdit(k, $event)" 
                    class="btn btn-sm btn-light" 
                    title="Düzenle">
              <i class="bi bi-pencil"></i>
            </button>
            <button (click)="onDelete(k.id!, $event)" 
                    class="btn btn-sm btn-light text-danger" 
                    [disabled]="!k.id" 
                    title="Sil">
              <i class="bi bi-trash"></i>
            </button>
          </div>
        </div>
      }
    </div>
  } @else {
    <div class="empty-state">
      <i class="bi bi-people"></i>
      <p>Kullanıcı bulunamadı.</p>
    </div>
  }
</div>
