<div class="table-responsive">
	<table class="table table-hover align-middle">
		<thead class="table-light">
			<tr>
				<th scope="col">Kod</th>
				<th scope="col">Ad Soyad</th>
				<th scope="col">Ünvan</th>
				<th scope="col">İşlemler</th>
			</tr>
		</thead>
		<tbody>
			@for (egitmen of egitmenler; track egitmen.id) {
				<tr>
					<td>{{ egitmen.kod }}</td>
					<td>
						<strong>{{ (egitmen.kullanici?.ad || '') + ' ' + (egitmen.kullanici?.soyad || '') }}</strong>
					</td>
					<td>{{ egitmen.unvan || '-' }}</td>
					<td>
						<div class="btn-group" role="group">
							<button 
								type="button" 
								class="btn btn-sm btn-outline-primary"
								(click)="egitmen.id && onView(egitmen.id)"
								title="Detay">
								<i class="bi bi-eye"></i>
							</button>
							<button 
								type="button" 
								class="btn btn-sm btn-outline-secondary"
								(click)="egitmen.id && onEdit(egitmen.id)"
								title="Düzenle">
								<i class="bi bi-pencil"></i>
							</button>
						</div>
					</td>
				</tr>
			}
		</tbody>
	</table>
</div>
