<div class="container-fluid mt-4">
	<div class="row">
		<div class="col-12">
			<div class="card">
				<div class="card-header">
					<h5 class="mb-0">
						{{ isEditMode ? 'Eğitmen Düzenle' : 'Yeni Eğitmen' }}
					</h5>
				</div>
				<div class="card-body">
					@if (isLoading()) {
						<div class="text-center py-5">
							<div class="spinner-border text-primary" role="status">
								<span class="visually-hidden">Yükleniyor...</span>
							</div>
						</div>
					} @else {
						<app-egitmen-form
							[egitmenRequest]="egitmenRequest()"
							[isEditMode]="isEditMode"
							(save)="onSave($event)"
							(cancel)="onCancel()">
						</app-egitmen-form>
					}
				</div>
			</div>
		</div>
	</div>
</div>
