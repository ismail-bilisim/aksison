<ng-container *ngIf="egitmen$ | async as egitmen; else loading">
	<app-egitmen-temel
		[egitmen]="egitmen"
		[canEdit]="authService.hasRole(ROLES.PRJYN) || authService.hasRole(ROLES.ADMIN)"
		[canApprove]="authService.hasRole(ROLES.TAKLI) || authService.hasRole(ROLES.PRJYN)"
		[canPassive]="authService.hasRole(ROLES.ADMIN)"
		(edit)="edit()"
		(submitForApproval)="submitForApproval()"
		(approve)="onayla()"
		(reject)="reddet()"
		(pasifYap)="pasifYap()"
		(aktifYap)="aktifYap()">
	</app-egitmen-temel>

	<!-- Tabbed Section for Certificates, Contracts, Categories -->
	<section class="bg-white rounded-3 shadow-sm p-3 mt-3">
		<ul ngbNav #nav="ngbNav" [(activeId)]="activeTab" (activeIdChange)="onTabChange($event)" class="nav-tabs">
			<li [ngbNavItem]="1">
				<button ngbNavLink>
					<i class="bi bi-award me-2"></i>Sertifikalar
				</button>
			</li>
			<li [ngbNavItem]="2">
				<button ngbNavLink>
					<i class="bi bi-file-text me-2"></i>Sözleşmeler
				</button>
			</li>
			<li [ngbNavItem]="3">
				<button ngbNavLink>
					<i class="bi bi-tags me-2"></i>Kategoriler
				</button>
			</li>
			<li [ngbNavItem]="4">
				<button ngbNavLink>
					<i class="bi bi-camera-video me-2"></i>Video Dersler
				</button>
			</li>
			<li [ngbNavItem]="5">
				<button ngbNavLink>
					<i class="bi bi-people me-2"></i>Yüzyüze Dersler
				</button>
			</li>
		</ul>

		<div class="mt-3">
			<div class="p-3" [hidden]="activeTab() !== 1">
				<p class="text-muted">Sertifikalar listesi burada görüntülenecek.</p>
			</div>
			<div class="p-3" [hidden]="activeTab() !== 2">
				<p class="text-muted">Sözleşmeler listesi burada görüntülenecek.</p>
			</div>
			<div class="p-3" [hidden]="activeTab() !== 3">
				<app-kategori-list
					#kategoriList
					[items]="kategoriler()"
					[isLoading]="kategoriLoading()"
					[isDeleting]="kategoriDeleting()"
					[isAdding]="kategoriAdding()"
					[modalLoading]="kategoriModalLoading()"
					[availableKategoriler]="availableKategoriler()"
					(addRequested)="onKategoriAddRequested()"
					(addConfirmed)="onKategoriAdd($event)"
					(delete)="onKategoriDelete($event)">
				</app-kategori-list>
			</div>
			<div class="p-3" [hidden]="activeTab() !== 4">
				<app-videoders-list
					[videodersler]="videodersler()"
					[isLoading]="videodersLoading()"
					[errorMessage]="videodersError()"
					(select)="onVideodersSelect($event)">
				</app-videoders-list>
			</div>
			<div class="p-3" [hidden]="activeTab() !== 5">
				<app-yuzyuzeders-list
					[yuzyuzedersler]="yuzyuzedersler()"
					[isLoading]="yuzyuzedersLoading()"
					[errorMessage]="yuzyuzedersError()"
					(select)="onYuzyuzedersSelect($event)">
				</app-yuzyuzeders-list>
			</div>
		</div>
	</section>
</ng-container>

<ng-template #loading>
	<div class="text-center py-5">
		<div class="spinner-border text-primary" role="status">
			<span class="visually-hidden">Yükleniyor...</span>
		</div>
	</div>
</ng-template>

<!-- Approval/Rejection Modal -->
@if (showApprovalModal()) {
	<div class="modal d-block" tabindex="-1" style="background-color: rgba(0,0,0,0.45);">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content rounded-3 shadow-lg border-0">
				<div class="modal-header border-0 pb-0">
					<h5 class="modal-title fw-semibold">
						@if (approvalAction() === 'approve') {
							<i class="bi bi-check-circle text-success me-2"></i>Eğitmen Onayı
						} @else {
							<i class="bi bi-x-circle text-danger me-2"></i>Eğitmen Reddi
						}
					</h5>
					<button type="button" class="btn-close" (click)="closeApprovalModal()"></button>
				</div>
				<div class="modal-body pt-0">
					<div class="mb-3">
						<label for="approvalComment" class="form-label">
							@if (approvalAction() === 'approve') {
								Onay Açıklaması (Opsiyonel)
							} @else {
								Red Sebebi <span class="text-danger">*</span>
							}
						</label>
						<textarea 
							id="approvalComment" 
							class="form-control" 
							rows="3"
							[placeholder]="approvalAction() === 'approve' ? 'Onay açıklaması...' : 'Red sebebi...'"
							[ngModel]="approvalComment()"
							(ngModelChange)="approvalComment.set($event)">
						</textarea>
					</div>
				</div>
				<div class="modal-footer border-0">
					<button type="button" class="btn btn-link text-muted" (click)="closeApprovalModal()">İptal</button>
					<button 
						type="button" 
						[class]="approvalAction() === 'approve' ? 'btn btn-success' : 'btn btn-danger'"
						(click)="confirmApproval()"
						[disabled]="isLoading() || (approvalAction() === 'reject' && !approvalComment())">
						@if (approvalAction() === 'approve') {
							Onayla
						} @else {
							Reddet
						}
					</button>
				</div>
			</div>
		</div>
	</div>
}
