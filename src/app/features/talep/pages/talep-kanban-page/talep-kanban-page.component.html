<div class="container-fluid mt-4">
  <!-- Page Header -->
  <div class="row mb-4">
    <div class="col">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <h5 class="mb-1">
            <i class="bi bi-kanban me-2"></i>
            Talep Kanban Panosu
          </h5>
        </div>
        
        <!-- Date Range Filter -->
        <div class="filter-section">
          <label for="dateFilter" class="form-label text-muted small mb-1">Tarih Aralığı</label>
          <select 
            id="dateFilter"
            class="form-select form-select-sm" 
            [formControl]="dateRangeFilter"
            style="min-width: 150px;">
            <option value="bu ay">Bu Ay</option>
            <option value="3 ay">Son 3 Ay</option>
            <option value="6 ay">Son 6 Ay</option>
            <option value="bu yıl">Bu Yıl</option>
            <option value="1 yıl">Son 1 Yıl</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Loading State -->
  @if (isLoading) {
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Yükleniyor...</span>
      </div>
      <p class="text-muted mt-2">Kanban verileri yükleniyor...</p>
    </div>
  }

  <!-- Kanban Board -->
  @if (!isLoading) {
    <app-talep-kanban
      [columns]="columns"
      [talepDurumlari]="talepDurumlari"
      (viewDetail)="onViewDetail($event)">
    </app-talep-kanban>
  }
</div>
