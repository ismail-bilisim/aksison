<ng-container *ngIf="talep$ | async as talep; else loading">
	<app-talep-temel
		[talep]="talep"
		[canEdit]="authService.hasRole(ROLES.TAKLI)"
		[canApprove]="authService.hasRole('ROLE_PRJYN')"
		[canDelete]="authService.hasRole('ADMIN')"
		[canAssignToSelf]="authService.hasRole(ROLES.PRJYN)"
		[canAssignToOthers]="authService.hasRole(ROLES.TAKLI)"
		[assignableUsers]="assignableUsers$()"
		(edit)="edit()"
		(submitForApproval)="submitForApproval()"
		(approve)="onayla()"
		(reject)="reddet()"
		(assignToSelf)="assignToSelf()"
		(assignToOther)="openAssignModal()"
		(delete)="delete($event)">
	</app-talep-temel>
</ng-container>

<!-- Assignment Modal -->
@if (showAssignModal()) {
	<div class="modal d-block" tabindex="-1" style="background-color: rgba(0,0,0,0.45);">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content rounded-3 shadow-lg border-0">
				<div class="modal-header border-0 pb-0">
					<h5 class="modal-title fw-semibold">Talep Ata</h5>
					<button type="button" class="btn-close" (click)="closeAssignModal()"></button>
				</div>
				<div class="modal-body pt-0">
					<div class="mb-3">
						<label for="assignUser" class="form-label">Kullanıcı Seçin</label>
						<select 
							id="assignUser" 
							class="form-select form-select-sm"
							[ngModel]="selectedUserId()"
							(ngModelChange)="selectedUserId.set($event)">
							<option [ngValue]="null">-- Kullanıcı Seçin --</option>
							@for (user of assignableUsers$(); track user.id) {
								<option [ngValue]="user.id">{{ user.ad }} {{ user.soyad }}</option>
							}
						</select>
					</div>
				</div>
				<div class="modal-footer border-0">
					<button type="button" class="btn btn-link text-muted" (click)="closeAssignModal()">İptal</button>
					<button 
						type="button" 
						class="btn btn-primary"
						(click)="handleAssignToOther()"
						[disabled]="!selectedUserId() || isLoading()">
						Ata
					</button>
				</div>
			</div>
		</div>
	</div>
}

<!-- Approval/Rejection Modal -->
@if (showApprovalModal()) {
	<div class="modal d-block" tabindex="-1" style="background-color: rgba(0,0,0,0.45);">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content rounded-3 shadow-lg border-0">
				<div class="modal-header border-0 pb-0 d-flex align-items-center gap-2">
					<h5 class="modal-title mb-0 fw-semibold">
						@if (approvalAction() === 'approve') {
							<i class="bi bi-check-circle text-success me-2"></i>Talep Onayı
						} @else {
							<i class="bi bi-x-circle text-danger me-2"></i>Talep Reddi
						}
					</h5>
					<button type="button" class="btn-close" (click)="closeApprovalModal()"></button>
				</div>
				<div class="modal-body pt-0">
					<div class="mb-3">
						<label for="approvalComment" class="form-label">
							@if (approvalAction() === 'approve') {
								Onay Açıklaması (Opsiyonel)
							} @else {
								Red Sebebi <span class="text-danger">*</span>
							}
						</label>
						<textarea 
							id="approvalComment" 
							class="form-control" 
							rows="3"
							[placeholder]="approvalAction() === 'approve' ? 'Onay ile ilgili açıklama giriniz...' : 'Red sebebini giriniz...'"
							[ngModel]="approvalComment()"
							(ngModelChange)="approvalComment.set($event)">
						</textarea>
						@if (approvalAction() === 'reject') {
							<small class="text-muted">Red sebebi zorunludur.</small>
						}
					</div>
				</div>
				<div class="modal-footer border-0">
					<button type="button" class="btn btn-link text-muted" (click)="closeApprovalModal()">İptal</button>
					@if (approvalAction() === 'approve') {
						<button 
							type="button" 
							class="btn btn-success"
							(click)="confirmApprovalAction()"
							[disabled]="isLoading()">
							<i class="bi bi-check-lg me-1"></i>Onayla
						</button>
					} @else {
						<button 
							type="button" 
							class="btn btn-danger"
							(click)="confirmApprovalAction()"
							[disabled]="isLoading() || !approvalComment()">
							<i class="bi bi-x-lg me-1"></i>Reddet
						</button>
					}
				</div>
			</div>
		</div>
	</div>
}

<ng-template #loading>
	<div class="text-center py-4">
		<div class="spinner-border" role="status"></div>
	</div>
</ng-template>
