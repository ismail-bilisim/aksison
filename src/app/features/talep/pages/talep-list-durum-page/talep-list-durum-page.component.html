<div class="container-fluid mt-4">
  <!-- Page Header -->
  <div class="row mb-4">
    <div class="col">
      <h5 class="mb-3">{{ pageTitle }}</h5>
      
      <!-- Date Range Filter -->
      <div class="card mb-3">
        <div class="card-body">
          <div class="row g-3 align-items-end">
            <div class="col-sm-5">
              <label for="startDate" class="form-label">Başlangıç Tarihi</label>
              <input 
                type="date" 
                id="startDate" 
                class="form-control" 
                [(ngModel)]="startDate"
                (change)="onDateRangeChange()">
            </div>
            <div class="col-sm-5">
              <label for="endDate" class="form-label">Bitiş Tarihi</label>
              <input 
                type="date" 
                id="endDate" 
                class="form-control" 
                [(ngModel)]="endDate"
                (change)="onDateRangeChange()">
            </div>
            <div class="col-sm-2">
              <button 
                class="btn btn-primary w-100" 
                (click)="onDateRangeChange()"
                [disabled]="loading">
                <i class="bi bi-search me-2"></i>
                Bul
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Loading State -->
  @if (loading) {
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Yükleniyor...</span>
      </div>
    </div>
  }

  <!-- Error State -->
  @if (error && !loading) {
    <div class="alert alert-danger" role="alert">
      <i class="bi bi-exclamation-triangle me-2"></i>
      {{ error }}
    </div>
  }

  <!-- Talep List -->
  @if (!loading && !error) {
    @if (talepler.length === 0) {
      <div class="alert alert-info" role="alert">
        <i class="bi bi-info-circle me-2"></i>
        Seçilen tarih aralığında talep bulunamadı.
      </div>
    } @else {
      <div class="row mb-3">
        <div class="col">
          <span class="badge bg-secondary">
            Toplam {{ talepler.length }} talep bulundu
          </span>
        </div>
      </div>
      
      <app-talep-list
        [talepler]="talepler"
        [isLoading]="loading"
        (view)="viewDetail($event)"
        (edit)="onEdit($event)"
        (delete)="onDelete($event)">
      </app-talep-list>
    }
  }
</div>
