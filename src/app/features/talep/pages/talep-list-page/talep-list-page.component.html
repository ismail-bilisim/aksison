<div class="d-flex justify-content-between align-items-center mb-3">
	<h4>Talepler</h4>
	<div class="d-flex gap-2">
		@if (authService.hasAccess('TALEP', 'APPROVE')) {
			<a routerLink="/talep/onay-bekleyen" class="btn btn-outline-warning">
				<i class="bi bi-hourglass-split me-1"></i> Onay Bekleyenler
			</a>
		}
		@if (authService.hasAccess('TALEP', 'CREATE')) {
			<button class="btn btn-success" (click)="create()">
				<i class="bi bi-plus-lg me-1"></i> Yeni Talep
			</button>
		}
	</div>
</div>

<div class="card mb-3">
	<div class="card-body">
		<div class="row mb-3">
			<div class="col-md-4">
				<input type="text" class="form-control" [formControl]="talepAdiFilter" placeholder="Talep Sonuç ile Ara">
			</div>
			<div class="col-md-4">
				<select class="form-select" [formControl]="talepDurumuFilter">
					<option value="">Tüm Durumlar</option>
					@for (durum of talepDurumlari$ | async; track durum.id) {
						<option [value]="durum.kodu">{{ durum.adi }}</option>
					}
				</select>
			</div>
			<div class="col-md-4">
				<select class="form-select" [formControl]="dateRangeFilter">
					<option value="bu ay">Bu Ay</option>
					<option value="3 ay">Son 3 Ay</option>
					<option value="6 ay">Son 6 Ay</option>
					<option value="bu yıl">Bu Yıl</option>
					<option value="1 yıl">Son 1 Yıl</option>
				</select>
			</div>
		</div>
	</div>
</div>

<app-talep-list
	[items]="items$ | async"
	[isLoading]="isLoading()"
	(view)="viewDetail($event)"
	(edit)="edit($event)">
</app-talep-list>
