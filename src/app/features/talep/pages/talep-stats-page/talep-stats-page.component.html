<div class="container-fluid">
  <div class="row">
    <div class="col-12">
      <!-- Page Header -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h4>
          <i class="bi bi-graph-up me-2 text-primary"></i>
          Talep İstatistikleri
        </h4>
        
        <!-- Date Range Filter -->
        <div class="d-flex align-items-center gap-2">
          <label for="dateRange" class="form-label mb-0">Dönem:</label>
          <select [formControl]="selectedDateRange" id="dateRange" class="form-select form-select-sm" style="width: auto;">
            <option value="bugün">Bugün</option>
            <option value="bu hafta">Bu Hafta</option>
            <option value="bu ay">Bu Ay</option>
            <option value="bu yıl">Bu Yıl</option>
            <option value="tüm zamanlar">Tüm Zamanlar</option>
          </select>
        </div>
      </div>

      <!-- Stats Component -->
      <app-talep-stats 
        [talepStats]="talepStats"
        [loading]="loading">
      </app-talep-stats>
    </div>
  </div>
</div>
