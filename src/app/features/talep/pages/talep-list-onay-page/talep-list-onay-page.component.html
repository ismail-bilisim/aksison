<div class="d-flex justify-content-between align-items-center mb-3">
	<h6>
		<i class="bi {{ pageIcon() }} me-2 text-primary"></i>
		{{ pageTitle() }}
	</h6>
	<a routerLink="/talep" class="btn btn-outline-secondary btn-sm">
		<i class="bi bi-arrow-left me-1"></i>Tüm Talepler
	</a>
</div>

@if (isLoading()) {
	<div class="text-center py-4">
		<div class="spinner-border" role="status">
			<span class="visually-hidden">Yükleniyor...</span>
		</div>
	</div>
} @else {
	<app-talep-list
		[talepler]="(talepler$ | async) ?? []"
		[isLoading]="isLoading()"
		(view)="viewDetail($event)">
	</app-talep-list>
}
