<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h3 class="card-title">Talepler Listesi</h3>
  </div>
  <div class="card-body">
    <div *ngIf="isLoading" class="text-center py-4">
      <div class="spinner-border" role="status"></div>
    </div>

    <div *ngIf="!isLoading">
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th>ID</th>
              <th>Tarih</th>
              <th>Durum</th>
              <th>Aksiyonlar</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let talep of items">
              <td>{{ talep.id }}</td>
              <td>{{ talep.talepTarihi | date:'shortDate' }}</td>
              <td>
                <span class="" >
                  {{ talep.talepDurumu?.adi }}
                </span>
              </td>
              <td>
                <button class="btn btn-sm btn-info me-2" (click)="onView(talep.id)">Görüntüle</button>
                <button class="btn btn-sm btn-primary me-2" (click)="onEdit(talep.id)">Düzenle</button>
              </td>
            </tr>
            <tr *ngIf="!(items?.length)">
              <td colspan="5" class="text-center">Kayıt bulunamadı.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
