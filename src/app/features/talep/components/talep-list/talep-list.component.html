<div class="card">
  <div class="card-body">
    @if (isLoading) {
      <div class="text-center py-4">
        <div class="spinner-border" role="status"></div>
      </div>
    } @else {
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th>ID</th>
              <th>Talep Konusu</th>
              <th>Tarih</th>
              <th>Durum</th>
              <th>Aksiyonlar</th>
            </tr>
          </thead>
          <tbody>
            @for (talep of items; track talep.id) {
              <tr>
                <td>{{ talep.id }}</td>
                <td>{{ talep.talepKonusu.adi }}</td>
                <td>{{ talep.talepTarihi | date:'shortDate' }}</td>
                <td>
                  <span class="badge" [ngClass]="{
                    'bg-primary': talep.talepDurumu.kodu === 'YENI',
                    'bg-info': talep.talepDurumu.kodu === 'DEVAM',
                    'bg-success': talep.talepDurumu.kodu === 'TAMAM',
                    'bg-danger': talep.talepDurumu.kodu === 'IPTAL'
                  }">
                    {{ talep.talepDurumu.adi }}
                  </span>
                </td>
                <td>
                  <button class="btn btn-sm btn-info me-1" (click)="onView(talep.id)" title="Görüntüle">
                    <i class="bi bi-eye"></i>
                  </button>
                  <button class="btn btn-sm btn-primary me-1" (click)="onEdit(talep.id)" title="Düzenle">
                    <i class="bi bi-pencil"></i>
                  </button>
                </td>
              </tr>
            } @empty {
              <tr>
                <td colspan="5" class="text-center text-muted py-3">Kayıt bulunamadı.</td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    }
  </div>
</div>
