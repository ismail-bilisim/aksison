<div class="card">
  <div class="card-body">
    @if (isLoading) {
      <div class="text-center py-4">
        <div class="spinner-border" role="status"></div>
      </div>
    } @else {
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th>ID</th>
              <th>Tarih</th>
              <th>Sahibi</th>
              <th>İçeriği</th>
              <th>Detay</th>
            </tr>
          </thead>
          <tbody>
            @for (talep of talepler; track talep.id) {
              <tr (click)="onView(talep.id)">
                <td>{{ talep.id }}</td>
                <td>{{ talep.talepTarihi }}</td>
                <td>{{ talep.talepSahibi }}</td>
                <td>{{ talep.talepIcerik }}</td>
                <td colspan="5">
                  <button class="btn btn-sm btn-outline-primary me-1 row-button" (click)="onView(talep.id)" title="Görüntüle">
                    <i class="bi bi-eye"></i>
                  </button>
                </td>
              </tr>
            } @empty {
              <tr>
                <td colspan="5" class="text-center text-muted py-3">Kayıt bulunamadı.</td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    }
  </div>
</div>
