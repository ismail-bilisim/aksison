<div class="dialog-panel">
  <div class="modal-header bg-success text-white">
    <h5 class="modal-title">
      <i class="me-2"></i>₺ Ücret Bilgisi Gir
    </h5>
    <button type="button" class="btn-close btn-close-white" (click)="cancel()"></button>
  </div>

  <div class="modal-body">
    <p class="mb-3">
      <strong>{{ data.entityName }}</strong> isimli ders için ücret bilgilerini giriniz.
    </p>

    <!-- Ödeme Kaynağı -->
    <div class="mb-3">
      <label class="form-label fw-semibold">Ödeme Kaynağı <span class="text-danger">*</span></label>
      @if (loading) {
        <div class="text-muted small"><i class="bi bi-hourglass-split me-1"></i>Yükleniyor...</div>
      } @else {
        <select class="form-select" [(ngModel)]="odemeKaynakKodu" required>
          <option value="" disabled>Seçiniz...</option>
          @for (ok of odemeKaynaklar; track ok.kodu) {
            <option [value]="ok.kodu">{{ ok.adi }}</option>
          }
        </select>
      }
    </div>

    <!-- Birim Ücret -->
    <div class="mb-3">
      <label class="form-label fw-semibold">Birim Ücret (₺) <span class="text-danger">*</span></label>
      <input type="number" class="form-control" [(ngModel)]="birimUcret" min="0" step="0.01"
             placeholder="Örn: 150.00" required>
    </div>

    <!-- Toplam Ücret -->
    <div class="mb-3">
      <label class="form-label fw-semibold">Toplam Ücret (₺) <span class="text-danger">*</span></label>
      <input type="number" class="form-control" [(ngModel)]="toplamUcret" min="0" step="0.01"
             placeholder="Örn: 3000.00" required>
    </div>

    <!-- Not -->
    <div class="mb-3">
      <label class="form-label">Not (opsiyonel)</label>
      <textarea class="form-control" rows="2" [(ngModel)]="not"
                placeholder="İsteğe bağlı notunuzu buraya yazabilirsiniz..."></textarea>
    </div>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="cancel()">
      <i class="bi bi-x-lg me-1"></i>İptal
    </button>
    <button type="button" class="btn btn-success" (click)="confirm()" [disabled]="!formValid">
      <i class="bi bi-check-circle me-1"></i>Kaydet
    </button>
  </div>
</div>
