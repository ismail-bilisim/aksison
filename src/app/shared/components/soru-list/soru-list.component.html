<div class="soru-list">
  <!-- Empty State -->
  <div *ngIf="sorular.length === 0" class="empty-state p-5 text-center">
    <div class="empty-icon mb-3">
      <i class="bi bi-question-circle" style="font-size: 3rem; color: #6c757d;"></i>
    </div>
    <p class="empty-text text-muted mb-3">Bu derse henüz soru eklenmemiş</p>
    <button class="btn btn-primary" (click)="openSoruModal()">
      <i class="bi bi-plus-circle me-2"></i>Soru Ekle
    </button>
  </div>

  <!-- Sorular List -->
  <div *ngIf="sorular.length > 0">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h6 class="mb-0">Sayı: {{sorular.length}}</h6>
      <button class="btn btn-sm btn-primary" (click)="openSoruModal()">
        <i class="bi bi-plus-circle me-1"></i>Soru Ekle
      </button>
    </div>

    <div class="list-group">
      <div *ngFor="let dersSoru of sorular; let i = index" class="list-group-item list-group-item-compact py-2">
        <div class="d-flex align-items-center gap-2">
          <span class="">{{i + 1}}.</span>
          <span class="badge bg-info text-truncate" style="max-width: 80px;">{{dersSoru.soru.soruTipi}}</span>
          <span class="badge bg-secondary" *ngIf="dersSoru.konuId">
            <i class="bi bi-link-45deg"></i>
          </span>
          <div class="flex-grow-1 text-truncate small clickable-text" 
               (click)="navigateToSoruDetail(dersSoru.soru.id)"
               role="button"
               title="Soru detayını görüntüle">
            {{dersSoru.soru.soruMetni}}
          </div>
          <button class="btn btn-sm btn-outline-primary" 
                  (click)="navigateToSoruEdit(dersSoru.soru.id)"
                  title="Soruyu düzenle">
            <i class="bi bi-pencil"></i>
          </button>
          <button class="btn btn-sm btn-outline-danger" 
                  (click)="deleteDersSoru(dersSoru)"
                  title="Soruyu sil">
            <i class="bi bi-trash"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Soru Modal Component -->
<app-soru-modal 
  [dersId]="dersId"
  (saveRequested)="soruSaveRequested.emit($event)">
</app-soru-modal>
