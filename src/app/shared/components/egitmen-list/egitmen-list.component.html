<div class="d-flex justify-content-end align-items-center mb-3" *ngIf="!loading">
  <button class="btn btn-outline-primary btn-sm" (click)="requestAdd()" [disabled]="!canAssign">
    <i class="bi bi-person-plus"></i>
    Eğitmen Ata
  </button>
</div>

<div *ngIf="loading" class="text-center p-3">
  <div class="spinner-border spinner-border-sm" role="status">
    <span class="visually-hidden">Yükleniyor...</span>
  </div>
</div>

<div *ngIf="!loading && items.length === 0" class="alert alert-info">
  Bu ders için eğitmen kaydı bulunmamaktadır.
</div>

<div *ngIf="!loading && items.length > 0" class="row">
  <div class="col-md-6 col-lg-4 mb-3" *ngFor="let egitmen of items">
    <div class="card h-100 shadow-sm">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-start mb-2">
          <div>
            <h6 class="card-title mb-1">
              <i class="bi bi-person-video3 me-2"></i>
              {{ egitmen.kullanici?.ad }} {{ egitmen.kullanici?.soyad }}
            </h6>
            <small class="text-muted">TC: {{ egitmen.kullanici?.tcKimlikNo }}</small>
          </div>
          <button class="btn btn-sm btn-outline-danger" (click)="delete.emit(egitmen.id!)" title="Kaldır">
            <i class="bi bi-trash"></i>
          </button>
        </div>
        <div class="text-muted small">
          <i class="bi bi-mortarboard me-1"></i>{{ egitmen.unvan || 'Eğitmen' }}
        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #egitmenModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title">
      <i class="bi bi-person-plus me-2"></i>Eğitmen Ata
    </h5>
    <button type="button" class="btn-close" (click)="modal.dismiss()" [disabled]="assigning"></button>
  </div>
  <div class="modal-body">
    <div class="mb-3">
      <input type="text" class="form-control" placeholder="İsim veya TCKN ile ara..." [(ngModel)]="searchTerm" (ngModelChange)="addRequested.emit(searchTerm)">
    </div>

    <div *ngIf="modalLoading" class="text-center p-3">
      <div class="spinner-border spinner-border-sm" role="status">
        <span class="visually-hidden">Onaylı eğitmenler yükleniyor...</span>
      </div>
    </div>
    <div *ngIf="!modalLoading && availableEgitmenler.length === 0" class="alert alert-info">Uygun eğitmen bulunamadı.</div>
    <div *ngIf="!modalLoading && availableEgitmenler.length > 0" class="list-group" style="max-height: 400px; overflow-y: auto;">
      <label *ngFor="let egitmen of availableEgitmenler" class="list-group-item list-group-item-action" [class.active]="selectedEgitmenIds.includes(egitmen.id!)">
        <div class="d-flex align-items-center">
          <input type="checkbox" class="form-check-input me-3" [checked]="selectedEgitmenIds.includes(egitmen.id!)" (change)="toggleSelect(egitmen.id!)">
          <div class="flex-grow-1">
            <div class="fw-semibold">{{ egitmen.kullanici?.ad }} {{ egitmen.kullanici?.soyad }}</div>
            <small class="text-muted">TC: {{ egitmen.kullanici?.tcKimlikNo }}</small>
            <div class="text-muted small">{{ egitmen.unvan || 'Eğitmen' }}</div>
          </div>
        </div>
      </label>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="modal.dismiss()" [disabled]="assigning">
      <i class="bi bi-x-lg me-1"></i>İptal
    </button>
    <button type="button" class="btn btn-primary" (click)="confirmAdd()" [disabled]="assigning || selectedEgitmenIds.length === 0">
      <span *ngIf="assigning" class="spinner-border spinner-border-sm me-2" role="status"></span>
      <i class="bi bi-check-lg me-1" *ngIf="!assigning"></i>
      Ata ({{ selectedEgitmenIds.length }})
    </button>
  </div>
</ng-template>
