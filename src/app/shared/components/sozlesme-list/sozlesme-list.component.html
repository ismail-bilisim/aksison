<div *ngIf="loading" class="text-center p-3">
  <div class="spinner-border spinner-border-sm" role="status">
    <span class="visually-hidden">Yükleniyor...</span>
  </div>
</div>

<div *ngIf="!loading && items.length === 0" class="alert alert-info">
  Bu ders için sözleşme kaydı bulunmamaktadır.
</div>

<div *ngIf="!loading && items.length > 0" class="row">
  <div class="col-md-6 col-lg-4 mb-3" *ngFor="let sozlesme of items">
    <div class="card h-100 shadow-sm" style="cursor: pointer;" (click)="onSelect(sozlesme)">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-start mb-2">
          <h6 class="card-title mb-1">
            <i class="bi bi-file-earmark-text me-2"></i>
            {{ sozlesme.egitmen.kullanici?.ad }} {{ sozlesme.egitmen.kullanici?.soyad }}
          </h6>
          <span class="badge" [ngClass]="sozlesme.imzaTarihi ? 'bg-success' : 'bg-warning text-dark'">
            {{ sozlesme.imzaTarihi ? 'İmzalandı' : 'İmza Bekliyor' }}
          </span>
        </div>
        <div class="text-muted small mb-1">
          <i class="bi bi-calendar me-1"></i>Başlangıç: {{ sozlesme.baslangicTarihi }}
        </div>
        <div class="text-muted small mb-1" *ngIf="sozlesme.imzaTarihi">
          <i class="bi bi-pen me-1"></i>İmza: {{ sozlesme.imzaTarihi }}
        </div>
        <div class="text-muted small" *ngIf="sozlesme.dosyaAdi">
          <i class="bi bi-file-pdf me-1"></i>{{ sozlesme.dosyaAdi }}
        </div>
      </div>
    </div>
  </div>
</div>
